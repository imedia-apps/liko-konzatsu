<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<script>window.LIKO_VISIT={"api":"https://script.google.com/macros/s/AKfycbyuU9yiuUm9MtVp6uaCYXKlqPTpD68uqVXfL9WNAjdpBhBu-uh7L3P-9aS6WKZ01ML-gQ/exec","liffId":"2010583280-tXz1kN4D"};</script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liko 体験ガイド（Web試作版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F4; --beige:#F2ECE4; --sky:#EEF3F7; --blue:#5D87A8; --blue-dk:#41698A;
  --ink:#3A3F44; --muted:#767C82; --line:#E3DDD4; --pink:#EFDCD6; --rose:#D98A7E;
  --sage:#93AA92; --mustard:#D9B46A; --lineg:#06C755; --white:#fff;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.big{font-size:20px}
h1,h2,.lead,.instr,.note{text-wrap:balance;line-break:strict}
.fit{white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;letter-spacing:.03em}
button{font:inherit;color:inherit;cursor:pointer}
.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.12em;font-weight:500}
.wrap{max-width:640px;margin:0 auto;padding:0 20px env(safe-area-inset-bottom)}

/* banner */
.proto{background:#3F4A53;color:#fff;font-size:12px;line-height:1.5;padding:8px 40px 8px 14px;position:relative}
.proto button{position:absolute;right:6px;top:4px;background:none;border:0;color:#fff;font-size:18px;width:32px;height:32px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(250,248,244,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{position:relative;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:"Shippori Mincho",serif;font-weight:600;font-size:12px;padding:0;letter-spacing:.02em;border:0;flex:none}
.hd-r{display:flex;gap:6px;align-items:center}
.langs{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:none;border-radius:999px;padding:6px 9px;font-size:13px;line-height:1.2;color:var(--muted);min-height:34px;white-space:nowrap}
.langs button[aria-current="true"]{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:360px){.langs button{padding:6px 6px;font-size:12px}}
.toolbar{max-width:640px;margin:0 auto;display:flex;gap:8px;padding:0 14px 8px}
.chip{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:14px;min-height:40px;padding:4px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* common */
section{padding:28px 0 40px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--blue);text-align:center;margin:0 0 6px;font-weight:500}
h1,h2{margin:0 0 14px;text-align:center;font-weight:500;line-height:1.5}
h1{font-size:1.5rem}
h2{font-size:1.25rem}
.lead{text-align:center;color:var(--muted);margin:0 0 22px;font-size:.9rem}
.card{background:#fff;border-radius:22px;padding:22px;border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:999px;border:0;font-size:1rem;white-space:nowrap;font-weight:700;padding:10px 20px;text-align:center;text-decoration:none;line-height:1.4}
.btn-line{background:var(--lineg);color:#fff}
.btn-pri{background:var(--blue);color:#fff}
.btn-out{background:#fff;color:var(--blue-dk);border:2px solid var(--blue)}
.btn-ghost{background:transparent;color:var(--blue-dk);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.4}
.small{font-size:.75rem;color:var(--muted)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;margin:20px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.backlink{background:none;border:0;color:var(--blue-dk);font-size:.8rem;padding:8px 0;display:inline-flex;align-items:center;gap:4px;min-height:44px}
.ctx{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--beige);border-radius:14px;padding:8px 14px;margin-bottom:10px;font-size:.8rem}
.ctx b{font-weight:700}
.ctx.ctxb{justify-content:flex-start}
.ctx .backbtn{width:32px;height:32px;min-height:32px;padding:0 0 2px;border-color:var(--line);font-size:20px}
.ctx button{border:1px solid var(--blue);background:#fff;color:var(--blue-dk);border-radius:999px;padding:4px 12px;font-size:.7rem;min-height:36px;flex:none}
.note{background:var(--sky);border-radius:14px;padding:12px 14px;font-size:.8rem;margin-bottom:18px}

/* hero */
.hero{background:var(--beige);border-radius:0 0 40px 40px;margin:0 -20px 26px;padding:26px 20px 30px;text-align:center}
.hero-icons{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.hero-icons svg{width:64px;height:64px}
.benefit{font-size:.85rem;color:var(--ink);margin:0 0 16px}
.benefit-list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font-size:.8rem}
.benefit-list li{display:flex;gap:8px;align-items:center}
.benefit-list li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rose);flex:none}

/* store list */
.region{margin:22px 0 8px;font-size:.75rem;letter-spacing:.15em;color:var(--blue);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px;text-align:left;min-height:64px}
.row .nm{font-size:1rem;font-weight:500}
.badge{font-size:.6rem;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid}
.b-y{color:var(--blue-dk);border-color:var(--blue);background:var(--sky)}
.b-n{color:#8a6a3a;border-color:var(--mustard);background:#FBF4E6}
.b-s{color:#7a5a5a;border-color:var(--rose);background:#FBEFEC}
.chev{color:var(--blue);font-size:1.2rem}

/* exp grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.exp{background:none;border:0;padding:6px 4px 10px;border-radius:20px;text-align:center}
.exp svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto 8px}
.exp .nm{font-weight:700;font-size:.85rem;line-height:1.4;display:block}
.exp .tm{font-size:.7rem;color:var(--muted)}

/* plans */
.plan{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px;text-align:left;min-height:56px}
.plan .pl{flex:1;min-width:0}
.plan[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
.plan .pn{font-weight:500;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan .pp{font-size:1rem;font-weight:700;color:var(--blue-dk);white-space:nowrap;flex:none}
.plan .pd{font-size:.75rem;color:var(--muted);line-height:1.5;white-space:pre-line}
.pop{font-size:.6rem;background:var(--rose);color:#fff;border-radius:999px;padding:2px 10px}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff}
.plan[aria-pressed="true"] .radio{border-color:var(--blue);box-shadow:inset 0 0 0 5px #fff;background:var(--blue)}
.extras{margin:8px 0 20px;padding:12px 16px;border-radius:14px;background:var(--beige);font-size:.8rem}
.extras b{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.exp-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.exp-head svg{width:48px;height:48px;flex:none}
.exp-head .nm{font-size:1rem;line-height:1.4;letter-spacing:.06em}
.plan-h{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 8px;text-align:left}
.sticky-cta{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(250,248,244,0),var(--bg) 30%)}

/* step */
.prog{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:.8rem;color:var(--blue-dk);font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.step-title{font-size:1.35rem;text-align:left;margin:0 0 12px}
.photo{position:relative;display:block;width:100%;border:0;padding:0;border-radius:22px;overflow:hidden;background:var(--beige)}
.photo svg{display:block;width:100%;height:auto}
.photo .zoomhint{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;font-size:13px;padding:4px 12px;color:var(--ink)}
.photo .ph{position:absolute;left:10px;top:10px;background:rgba(58,63,68,.75);color:#fff;border-radius:999px;font-size:12px;padding:3px 10px}
.instr{font-size:1.15rem;font-weight:500;margin:16px 0 8px;line-height:1.7}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 14px}
summary{min-height:44px;display:flex;align-items:center;color:var(--blue-dk);font-size:.85rem;cursor:pointer}
details p{margin:0 0 12px;font-size:.9rem}
.ask{margin:4px 0 18px}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}

.toc{list-style:none;margin:0 0 22px;padding:14px 16px;background:var(--beige);border-radius:16px;display:grid;gap:4px}
.toc button{border:0;background:none;padding:6px 0;text-align:left;font-size:.95rem;display:flex;gap:10px;align-items:center;width:100%;min-height:40px}
.tn{font-size:.7rem;font-weight:700;color:var(--blue);letter-spacing:.08em;flex:none;width:4.2em}
.stepc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 10px;scroll-margin-top:120px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sn{background:var(--blue);color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.1em;border-radius:999px;padding:3px 14px}
.of{font-size:.75rem;color:var(--muted)}
.stepc h3{font-size:1.2rem;margin:4px 0 8px;line-height:1.5}
.stepc .do{font-size:1.05rem;margin:0 0 10px;line-height:1.75}
.point{background:var(--beige);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:0 0 6px}
.point b{display:block;font-size:.7rem;letter-spacing:.15em;color:var(--rose)}
.asklink{border:0;background:none;color:var(--blue-dk);font-size:.85rem;padding:8px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.arrow{text-align:center;color:var(--blue);font-size:1.2rem;line-height:1;padding:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.opt{background:var(--sky);border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.6}
.opt b{display:block;color:var(--blue-dk);font-size:.95rem;margin-bottom:2px}
.pts{margin:0 0 10px;padding-left:1.2em;font-size:.95rem}
.pts li{margin-bottom:4px}
.subs{list-style:none;counter-reset:s;margin:0 0 10px;padding:0;display:grid;gap:8px}
.subs li{counter-increment:s;background:var(--sky);border-radius:12px;padding:10px 12px 10px 44px;position:relative;font-size:.9rem}
.subs li:before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.subs b{display:block;font-size:.95rem}
.notebox{border:1px dashed var(--rose);border-radius:12px;padding:8px 12px;font-size:.85rem;margin:0 0 10px;color:#8a5a52}
@media (max-width:360px){.opts{grid-template-columns:1fr}}
/* done */
.celebrate svg{width:180px;height:180px;display:block;margin:0 auto 12px}
.sum{display:grid;gap:4px;margin-bottom:18px}
.sum .k{font-size:.7rem;color:var(--muted);letter-spacing:.1em}
.sum .v{font-size:1rem;font-weight:700}
.sum .price{font-size:1.6rem;color:var(--blue-dk);font-weight:700}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(40,44,48,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
.sheet-hd h3{margin:0;font-size:1rem}
.x{border:0;background:var(--beige);border-radius:50%;width:44px;height:44px;font-size:20px}
.sheet-bd{overflow:auto;padding:16px 18px;flex:1}
.sheet-ft{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.tags span{font-size:.65rem;background:var(--sky);color:var(--blue-dk);border-radius:999px;padding:2px 10px}
.faq{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.faq .q{font-weight:700;margin-bottom:4px}
.faq .q:before{content:"Q. ";color:var(--blue)}
.faq .a{font-size:.9rem}
.msgs{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.sys{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg img{display:block;max-width:180px;border-radius:10px;margin-top:6px}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:52px;max-height:140px;border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-size:16px;resize:vertical;background:#fff}
.icobtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;font-size:12px;color:var(--blue-dk)}
.sendbtn{height:52px;border-radius:999px;border:0;background:var(--blue);color:#fff;padding:0 18px;font-weight:700;flex:none}
.preview{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.75rem}
.preview img{height:48px;border-radius:8px}
.zoom{position:fixed;inset:0;background:rgba(20,22,24,.9);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.zoom svg{width:100%;max-width:900px;height:auto;border-radius:16px;background:var(--beige)}
.zoom .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#fff}
ol.how{padding-left:1.3em;margin:0 0 16px;font-size:.9rem}
ol.how li{margin-bottom:6px}

/* ---- 1画面に収めるための詰め ---- */
.proto{font-size:11px;padding:6px 40px 6px 12px}
section{padding:14px 0 28px}
h1{font-size:1.3rem;margin-bottom:4px}
h2{font-size:1.1rem;margin-bottom:10px}
.eyebrow{font-size:11px;margin-bottom:2px}
.lead{font-size:.85rem;margin-bottom:12px}
.hero{padding:14px 20px 16px;margin-bottom:14px;border-radius:0 0 28px 28px}
.hero-icons{gap:8px;margin-bottom:6px}
.hero-icons svg{width:48px;height:48px}
.card{padding:16px 18px}
.benefit{margin:0 0 6px;font-size:.85rem}
.benefit-list{gap:0;margin:0 0 12px;font-size:.8rem;line-height:1.7}
.or{margin:10px 0}
.btn{min-height:50px}
.ctx{margin-bottom:8px}
.note{padding:8px 12px;margin-bottom:12px;font-size:.8rem}
.grid{grid-template-columns:repeat(3,1fr);gap:6px 8px}
.exp{padding:4px 2px 6px}
.exp svg{max-width:84px;margin-bottom:4px}
.exp .nm{font-size:.75rem}
.exp .tm{font-size:.65rem}
.grid{align-items:start}
.grid.g2{grid-template-columns:1fr 1fr;gap:12px 16px}
.grid.g2 .exp svg{max-width:124px;margin-bottom:6px}
.grid.g2 .exp .nm{font-size:.85rem}
.grid.g2 .exp .tm{font-size:.7rem}
.grid:not(.g2) .exp svg{max-width:96px}
.grid:not(.g2) .exp .nm{font-size:.78rem}
/* プラン画面を1画面に */
.toolbar{padding-bottom:6px}
.chip{min-height:34px;font-size:13px}
.ctx{padding:6px 12px}
.ctx button{min-height:30px;padding:2px 12px}
.backbtn{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--blue-dk);font-size:20px;line-height:1;display:grid;place-items:center;padding:0 0 2px}
.exp-head{gap:10px;margin:4px 0 10px}
.exp-head svg{width:42px;height:42px}
.plan{padding:8px 12px;min-height:48px;margin-bottom:6px;gap:10px}
.plan .pn{font-size:.95rem}
.plan .pp{font-size:.95rem}
.plan .pd{display:block;font-size:.7rem;line-height:1.35}
.plan .pop{font-size:.55rem;padding:1px 8px}
.radio{width:20px;height:20px}
.plan-h{margin-bottom:6px}
.extras{margin:4px 0 8px;padding:8px 12px}
.sticky-cta{position:static;padding:8px 0 16px;background:none}
.stepill{display:block;width:100%;border:0;padding:0;margin:2px 0 10px;border-radius:14px;overflow:hidden;background:#F5F0E9}
.stepill svg{display:block;width:100%;height:auto}
.opt{text-align:center}
.opt .mini{width:52px;height:52px;display:block;margin:0 auto 4px}
.opt span{display:block;text-align:left}
.subs li{display:flex;align-items:center;gap:10px}
.subs li>div{flex:1}
.subs .mini{width:48px;height:48px;flex:none}
.warnbox{background:#FBEFEC;border-left:4px solid var(--rose);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:0 0 10px}
.warnbox b{display:block;font-size:.72rem;color:#B5594C;letter-spacing:.08em}
.grid,.grid.g2{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.grid.g2{--cols:2}
.exp{min-width:0;overflow:hidden}
.exp .nm{max-width:100%}
.grid:not(.g2) .exp .nm{white-space:normal;text-wrap:balance;line-break:strict;line-height:1.35}
.stepc h3.big1{font-size:1.3rem;line-height:1.45;margin:2px 0 10px;text-wrap:balance}
.stepvid{display:block;width:100%;border-radius:14px;margin:2px 0 10px;background:#F5F0E9}
details.more{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:0 0 4px}
details.more summary{min-height:42px;font-size:.85rem;color:var(--blue-dk);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.more .do{font-size:.95rem}
.stepc{padding:16px 16px 8px}
.mailq{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;margin:4px 0 10px;background:#fff;resize:vertical}
.mailaddr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;font-size:.85rem;word-break:break-all}
.mailaddr button{flex:none;border:1px solid var(--blue);background:#fff;color:var(--blue-dk);border-radius:999px;padding:4px 12px;font-size:.75rem;min-height:34px}
a.btn{text-decoration:none}
/* ---- イラストのアニメーション ---- */
.stepill svg .pp,.stepill svg .sl,.zoom svg .pp,.zoom svg .sl{transform-box:fill-box;transform-origin:center}
@keyframes pop0{0%,4%{opacity:0;transform:scale(.2)}8%{opacity:1;transform:scale(1.15)}11%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(1)}}
.p0{animation:pop0 4.8s ease-out infinite}

function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function t(k,v){const a=T[k];let s=a?(a[LI[S.lang]]??a[0]):k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s}
function tr(a){return a[LI[S.lang]]??a[0]}
function storeName(st){if(!st)return'';if(S.lang==='ja')return st.ja;if(S.lang==='zhs')return st.zh||st.ja;if(S.lang==='zht')return st.zht||st.zh||st.ja;return st.ro}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function curStore(){return STORES.find(s=>s.id===S.store)}
function curPlan(){const e=EXP[S.exp];return e&&e.plans[S.plan??0]}

/* 店舗別二次元コード：URL末尾に #store-店舗ID（例 #store-nakazakicho） */
function readHash(){const h=location.hash.replace('#','');if(h.startsWith('store-')){const id=h.slice(6);if(STORES.find(s=>s.id===id)&&S.store!==id){S.store=id;S.qr=true;S.exp=null;S.plan=null;S.step=0;S.screen='exp';}}}
readHash();

function go(screen){S.screen=screen;UI.faqOpen=false;save();render();window.scrollTo(0,0)}

 ${e.kind==='staff'?`<div class="note">${t('coinInfo')}</div>`:`<p class="plan-h">${t('choosePlan')}<span class="small" style="font-weight:400">${t('taxIn')}</span></p>
 ${e.plans.map((p,i)=>`<button class="plan" data-plan="${i}" aria-pressed="${S.plan===i}"><span class="radio"></span><span class="pl"><span class="pn">${t(p.k)}${p.pop?`<span class="pop">${t('popular')}</span>`:''}</span>${p.n?`<span class="pd">${t(p.n)}</span>`:''}</span><span class="pp">${p.p}</span></button>`).join('')}
 ${e.x?`<div class="extras"><b>${t('extra')}</b>${e.x.map(k=>t(k)).join('<br>')}</div>`:''}`}
 <div class="sticky-cta"><button class="btn btn-pri" data-a="startPlan" ${S.plan==null&&e.kind!=='staff'?'disabled':''}>${e.kind==='staff'||e.kind==='buy'?t('next'):t('start')} →</button></div>
 </section></div>`;
}
function guideSteps(){const e=EXP[S.exp];const p=curPlan();if(p&&p.buy)return null;if(e.guide==='snake')return SNAKE;const g=GUIDES[S.exp];return g?g(PLAN_ID[p&&p.k]||'ippan'):null}
function artFor(st,i){return S.exp==='snake'?stepArt(i+1):artScene(st.art)}
function vGuide(){
 const steps=guideSteps();const e=EXP[S.exp];
 if(!steps){
  const msg=(curPlan()&&curPlan().buy)?t('partsInfo'):e.kind==='buy'?t('flowerInfo'):e.kind==='staff'?t('coinInfo'):t('guideSoon');
  return `<div class="wrap"><section>${ctxBar()}<button class="backlink" data-a="toPlan">‹ ${t('back')}</button>
  <div class="exp-head">${icon(S.exp)}<div><div class="nm mincho">${t('e_'+S.exp)}</div><div class="small">${curPlan()?t(curPlan().k):''}</div></div></div>
  <div class="card" style="font-size:1.05rem">${msg}</div>
  <div style="height:16px"></div><button class="btn btn-ghost" data-a="chat">💬 ${t('staff')}</button><div style="height:12px"></div>
  <button class="btn btn-pri" data-a="${e.kind==='buy'||(curPlan()&&curPlan().buy)?'toCheckout':'toDone'}">${e.kind==='buy'||(curPlan()&&curPlan().buy)?t('toCheckout'):t('finishedMaking')} →</button></section></div>`;
 }
 return `<div class="wrap"><section>${ctxBar()}<button class="backlink" data-a="toPlan">‹ ${t('back')}</button>
 <p class="eyebrow">HOW TO MAKE</p><h2 class="mincho">${t('e_'+S.exp)}</h2>
 <p class="lead">${t('scrollLead',{t:steps.length})}</p>
 ${steps.map((st,i)=>{const list=(st.listUnlimited&&curPlan()&&curPlan().k==='p_unlimited')?st.listUnlimited:st.list;const sh=shortFor(i);
  const vsrc=st.video||'';const media=vsrc?`<video class="stepvid" src="${vsrc}" autoplay muted loop playsinline preload="auto"></video>`:`<button class="stepill" data-zoomstep="${i}" aria-label="${t('tapZoom')}">${artFor(st,i)}</button>`;
  const more=`${st.how?`<div class="howbox"><b>${t('howTo')}</b><ol>${st.how.map(h=>`<li>${tr(h)}</li>`).join('')}</ol></div>`:''}<p class="do">${tr(st.lead||st.t)}</p>
   ${S.exp==='snake'&&i===0&&curPlan()&&curPlan().k==='p_student'?`<p class="notebox">${t('studentHook')}</p>`:''}
   ${st.opts?`<div class="opts">${st.opts.map((o,j)=>`<div class="opt">${miniArt(['hook','snap'][j])}<b>${tr(o[0])}</b><span>${tr(o[1])}</span></div>`).join('')}</div>`:''}
   ${list?`<ul class="pts">${list.map(x=>`<li>${tr(x)}</li>`).join('')}</ul>`:''}
   ${st.subs?`<ol class="subs">${st.subs.map((o,j)=>`<li><div><b>${tr(o[0])}</b><span>${tr(o[1])}</span></div>${miniArt(['twist','open','slide'][j])}</li>`).join('')}</ol>`:''}
   ${st.note?`<p class="notebox">${tr(st.note)}</p>`:''}
   ${st.d&&!st.warn?`<p class="point"><b>POINT</b>${tr(st.d)}</p>`:''}
   ${st.tip?`<p class="point"><b>${t('tipLabel')}</b>${tr(st.tip)}</p>`:''}`;
  return `<article class="stepc" id="step-${i+1}">
  <div class="sh"><span class="sn">STEP ${i+1}</span><span class="of">${i+1} / ${steps.length}</span></div>
  <h3 class="big1">${sh?tr(sh):tr(st.title)}</h3>
  ${media}
  ${st.info?`<p class="infobox">${tr(st.info)}</p>`:''}
  ${st.d&&st.warn?`<p class="warnbox"><b>⚠ ${t('caution')}</b>${tr(st.d)}</p>`:''}
  <details class="more"><summary>＋ ${t('more')}</summary>${more}</details>
  <button class="asklink" data-ask="${i}">💬 ${t('ask')}</button>
 </article>${i<steps.length-1?'<div class="arrow" aria-hidden="true">↓</div>':''}`}).join('')}
 <div style="height:20px"></div>
 <button class="btn btn-pri" data-a="toCheckout">${t('toCheckout')} →</button>
 </section></div>`;
}
function vDone(){
 return `<div class="wrap"><section class="celebrate" style="text-align:center">${celebrateIll()}<p class="eyebrow">COMPLETE</p><h1 class="mincho">${t('done')}</h1><p class="lead">${t('doneSub')}</p>
 <button class="btn btn-pri" data-a="toCheckout">${t('toCheckout')} →</button></section></div>`;
}
function vCheckout(){
 const p=curPlan();
 return `<div class="wrap"><section><p class="eyebrow">PAYMENT</p><h2 class="mincho">${t('checkout')}</h2>
 <div class="card"><div class="sum"><span class="k">${t('shop')}</span><span class="v">${esc(storeName(curStore()))}</span></div>
 <div class="sum"><span class="k">${t('yourExp')}</span><span class="v">${t('e_'+S.exp)}</span></div>
 ${p?`<div class="sum"><span class="k">${t('yourPlan')}</span><span class="v">${t(p.k)}</span>${p.p?`<span class="price">${p.p} <span class="small" style="font-weight:400">${t('taxIn')}</span></span>`:''}</div>`:''}
 ${EXP[S.exp].x?`<p class="small" style="margin:0 0 12px">${EXP[S.exp].x.map(k=>t(k)).join(' ／ ')}</p>`:''}
 <p style="margin:0 0 6px;font-size:.95rem">${t('payLead')}</p><p class="small" style="margin:0">${t('payMethods')}</p></div>
 <div style="height:16px"></div><button class="btn btn-pri" data-a="paid">${t('paid')} →</button>
 </section></div>`;
}
function vEnd(){
 return `<div class="wrap"><section style="text-align:center"><div class="hero-icons" style="margin:10px 0 16px">${icon('flower')}${icon('snake')}${icon('coin')}</div>
 <p class="eyebrow">THANK YOU</p><h1 class="mincho">${t('thanks')}</h1><p class="lead">${t('thanksSub')}</p>
 ${S.via!=='line'?`<div class="card" style="text-align:left;margin-bottom:16px"><p style="margin:0 0 12px;font-size:.9rem">${t('lineAgain')}</p><button class="btn btn-line" data-a="lineSheet">${t('lineAgainBtn')}</button></div>`:''}
 <button class="btn btn-out" data-a="restart">${t('restart')}</button></section></div>`;
}
function sheetLine(){
 return `<div class="overlay" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-stop>
 <div class="sheet-hd"><h3>${t('lineHowTitle')}</h3><button class="x" data-a="closeSheet" aria-label="close">×</button></div>
 <div class="sheet-bd"><ol class="how"><li>${t('lineHow1')}</li><li>${t('lineHow2')}</li><li>${t('lineHow3')}</li></ol>
 <a class="btn btn-line" href="#" data-a="openLine">${t('openLine')}</a>
 <p class="small" style="text-align:center">※試作版：LINE公式アカウントの登録用リンクは未設定です</p>
 <div style="height:8px"></div><button class="btn btn-ghost" data-a="web">${t('continueWeb')}</button></div></div></div>`;
}
function ctxTags(){
 const st=curStore(),steps=S.screen==='guide'?guideSteps():null;
 const tags=[st&&storeName(st),S.exp&&t('e_'+S.exp),curPlan()&&t(curPlan().k),steps&&t('stepOf',{n:S.step+1,t:steps.length})+' '+tr(steps[S.step].title),LANGS.find(l=>l[0]===S.lang)[1]].filter(Boolean);
 return `<div class="small">${t('sentWith')}</div><div class="tags">${tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
}
const MAIL='info@canvasart-liko.co.jp';
function mailParts(q){const st=curStore(),steps=S.screen==='guide'?guideSteps():null,p=curPlan();
 const J=k=>T[k]?T[k][0]:k;
 const lines=['【店舗】'+(st?st.ja:'-'),'【体験】'+(S.exp?J('e_'+S.exp):'-'),'【プラン】'+(p?J(p.k):'-'),'【工程】'+(steps?('STEP '+(S.step+1)+' '+steps[S.step].title[0]):'-'),'【言語】'+LANGS.find(l=>l[0]===S.lang)[1],'――――――――――',(q||'')];
 const subj='【Liko 体験ガイド】ご質問（'+(st?st.ja:'')+'）';
 return {subj,body:lines.join('\n')};}
function mailHref(q){const m=mailParts(q);return 'mailto:'+MAIL+'?subject='+encodeURIComponent(m.subj)+'&body='+encodeURIComponent(m.body)}
function mailText(q){const m=mailParts(q);return '宛先：'+MAIL+'\n件名：'+m.subj+'\n\n'+m.body}
function sheetChat(){
 const steps=S.screen==='guide'?guideSteps():null;const fromStep=UI.sheet==='ask'&&steps&&steps[S.step]&&steps[S.step].faq;
 const s=fromStep&&steps[S.step];
 const showCompose=!fromStep||UI.faqOpen;
 return `<div class="overlay" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-stop>
 <div class="sheet-hd"><h3>${fromStep?esc(tr(s.title)):t('staff')}</h3><button class="x" data-a="closeSheet" aria-label="close">×</button></div>
 <div class="sheet-bd">
 ${fromStep?`<div class="small" style="margin-bottom:6px">${t('faq')}</div><div class="faq"><div class="q">${tr(s.faq[0])}</div><div class="a">${tr(s.faq[1])}</div></div>
   ${!UI.faqOpen?`<button class="btn btn-out" data-a="faqNo">${t('notSolved')}</button>`:''}`:''}
 ${showCompose?`<p style="font-size:.9rem;margin:8px 0 4px">${t('mailLead')}</p>${ctxTags()}
   <textarea id="msg" class="mailq" placeholder="${t('chatPh')}" rows="3"></textarea>
   <a class="btn btn-pri" id="mailbtn" target="_blank" rel="noopener" href="${esc(mailHref(''))}">✉ ${t('mailBtn')}</a>
   <p class="small" style="margin:10px 0 4px">${t('mailPhoto')}</p>
   <div class="mailaddr"><span>${MAIL}</span><button data-a="copyMail">${UI.copied==='addr'?t('copied'):t('copy')}</button></div>
   <p class="small" style="margin:8px 0 0">${t('mailReply')}</p>`:''}
 </div>
 <div class="sheet-ft"><button class="btn btn-ghost" data-a="closeSheet">‹ ${t('backToStep')}</button></div>
 </div></div>`;
}
function render(){const _y=window.scrollY;
 document.documentElement.lang=S.lang==='zhs'?'zh-Hans':S.lang==='zht'?'zh-Hant':S.lang;
 document.documentElement.classList.toggle('big',!!S.big);
 if(S.screen==='entry')S.screen=curStore()?'exp':'store';
 if(S.screen!=='store'&&!curStore())S.screen='store';
 if(['plan','guide','done','checkout'].includes(S.screen)&&!S.exp)S.screen='exp';
 const v={entry:vEntry,store:vStore,exp:vExp,plan:vPlan,guide:vGuide,done:vDone,checkout:vCheckout,end:vEnd}[S.screen]||vEntry;
 let html=header()+'<main>'+v()+'</main>';
 if(UI.sheet==='line')html+=sheetLine();
 if(UI.sheet==='chat'||UI.sheet==='ask')html+=sheetChat();
 if(UI.zoom)html+=`<div class="zoom" data-a="unzoom"><button class="x" data-a="unzoom" aria-label="close">×</button>${UI.zoom}</div>`;
 document.getElementById('app').innerHTML=html;
 const f=document.getElementById('file');
 const mq=document.getElementById('msg'),mb=document.getElementById('mailbtn');if(mq&&mb)mq.oninput=()=>{mb.href=mailHref(mq.value)};
 if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{UI.pending=r.result;render()};r.readAsDataURL(file)};
 fitAll();
 if(window.scrollY!==_y)window.scrollTo(0,_y);
 const ms=document.querySelector('.sheet-bd');if(ms&&S.chat.length)ms.scrollTop=ms.scrollHeight;
}

/* ============ 操作 ============ */
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-a],[data-store],[data-exp],[data-plan],[data-lang],[data-jump],[data-ask],[data-zoomstep]');
 if(!el){if(UI.lang){UI.lang=false;render()}return}
 if(el.dataset.a==='closeSheet'&&ev.target.closest('[data-stop]')&&!ev.target.closest('.x,.backlink,.btn-ghost'))return;
 if(el.dataset.lang){const y=window.scrollY;S.lang=el.dataset.lang;save();render();window.scrollTo(0,y);return}
 if(el.dataset.store){S.store=el.dataset.store;S.exp=null;S.plan=null;S.step=0;go('exp');return}
 if(el.dataset.exp){S.exp=el.dataset.exp;S.plan=null;S.step=0;go('plan');return}
 if(el.dataset.zoomstep){const i=+el.dataset.zoomstep;UI.zoom=artFor(guideSteps()[i],i);render();return}
 if(el.dataset.jump){const d=document.getElementById('step-'+(+el.dataset.jump+1));if(d)d.scrollIntoView({behavior:'smooth'});return}
 if(el.dataset.ask){S.step=+el.dataset.ask;UI.sheet='ask';UI.faqOpen=false;render();return}
 if(el.dataset.plan){S.plan=+el.dataset.plan;save();render();return}
 const a=el.dataset.a;if(a!=='lang')UI.lang=false;
 switch(a){
  case 'proto':S.proto=false;save();render();break;
  case 'lang':UI.lang=!UI.lang;render();break;
  case 'home':UI.sheet=null;go(curStore()?'exp':'store');break;
  case 'big':S.big=!S.big;save();render();break;
  case 'lineSheet':UI.sheet='line';render();break;
  case 'openLine':ev.preventDefault();break; /* ← LINE公式アカウントの登録用URLを設定 */
  case 'web':UI.sheet=null;S.via='web';go(curStore()?'exp':'store');break;
  case 'toStore':go('store');break;
  case 'toExp':go('exp');break;
  case 'toPlan':go('plan');break;
  case 'startPlan':S.step=0;go('guide');break;
  case 'prev':if(S.step>0){S.step--;save();render();window.scrollTo(0,0)}else go('plan');break;
  case 'nextStep':{const st=guideSteps();if(S.step<st.length-1){S.step++;save();render();window.scrollTo(0,0)}else go('done');break}
  case 'toDone':go('done');break;
  case 'toCheckout':go('checkout');break;
  case 'paid':go('end');break;
  case 'restart':S.exp=null;S.plan=null;S.step=0;S.chat=[];go(curStore()?'exp':'store');break;
  case 'zoom':UI.zoom=stepIll(guideSteps()[S.step].ill);render();break;
  case 'unzoom':UI.zoom=null;render();break;
  case 'askStep':UI.sheet='ask';UI.faqOpen=false;render();break;
  case 'chat':UI.sheet='chat';render();break;
  case 'faqNo':UI.faqOpen=true;render();break;
  case 'closeSheet':UI.sheet=null;UI.copied=false;render();break;
  case 'rmImg':UI.pending=null;render();break;
  case 'copyBody':
  case 'copyMail':{const kind=a==='copyBody'?'body':'addr';const v0=document.getElementById('msg');const txt=kind==='addr'?MAIL:mailText(v0?v0.value:'');const done=()=>{UI.copied=kind;const v=document.getElementById('msg');const keep=v?v.value:'';render();const v2=document.getElementById('msg');if(v2){v2.value=keep;document.getElementById('mailbtn').href=mailHref(keep)}setTimeout(()=>{UI.copied=false},2000)};try{navigator.clipboard.writeText(txt).then(done,()=>{})}catch(e){}break}
  case 'send':{const ta=document.getElementById('msg');const v=ta.value.trim();if(!v&&!UI.pending)return;
   S.chat.push({from:'me',text:v,img:UI.pending});UI.pending=null;
   S.chat.push({from:'sys',text:t('sent')+'\n※試作版のため、実際には送信されません'});
   try{save()}catch(e){S.chat.forEach(m=>m.img=null)}render();break}
 }
});
/* 1行に収まらないときだけ文字を少し小さくする（変な位置で改行させない） */
function fitAll(){document.querySelectorAll('.btn,.fit').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize);const min=11;while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=0.5;el.style.fontSize=fs+'px'}if(el.scrollWidth>el.clientWidth+1){el.style.whiteSpace='normal'}})}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fitAll,100)});
if(document.fonts)document.fonts.ready.then(fitAll);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.sheet||UI.zoom||UI.lang)){UI.sheet=null;UI.zoom=null;UI.lang=false;render()}});
render();
</script>
<script src="guide-visit.js"></script>
</body>
